<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Маршрут</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
:root{--ink:#14232b;--teal:#0e7c86;--amber:#f4b400;--paper:#f4f6f6;--card:#fff;--line:#cfd8d9;--err:#b3261e}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--paper);color:var(--ink);font-size:15px;line-height:1.35}
#app{display:flex;flex-direction:column;height:100%}
#mapwrap{position:relative;flex:0 0 42%;min-height:220px}
#map{position:absolute;inset:0}
#cross{position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;pointer-events:none;z-index:500}
#cross:before,#cross:after{content:"";position:absolute;background:var(--ink);opacity:.7}
#cross:before{left:12px;top:0;width:2px;height:26px}
#cross:after{top:12px;left:0;height:2px;width:26px}
#panel{flex:1;overflow-y:auto;padding:12px 12px 8px;display:flex;flex-direction:column;gap:12px;-webkit-overflow-scrolling:touch}
section{display:flex;flex-direction:column;gap:6px}
h2{font-size:14px;font-weight:600;margin:0;color:var(--teal)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:18px;padding:7px 13px;font-size:14px;font-family:inherit}
.chip.on{background:var(--teal);border-color:var(--teal);color:#fff}
input[type=text],input[type=password]{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px;font-family:inherit;background:var(--card);color:var(--ink)}
button{font-family:inherit}
.btn{border:0;border-radius:10px;padding:11px 16px;font-size:15px;font-weight:600;background:var(--teal);color:#fff}
.btn.alt{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.45}
.toggle{display:flex;align-items:center;gap:10px;font-size:15px}
.toggle input{width:20px;height:20px;accent-color:var(--teal)}
.hint{font-size:13px;color:#52646b;margin:0}
#stops{display:flex;flex-direction:column;gap:4px}
.stop{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 6px 6px 10px}
.stop .tag{flex:0 0 26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}
.stop .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stop button{border:0;background:none;font-size:18px;padding:6px 10px;color:#52646b}
#status,#poiStatus{white-space:pre-line;font-weight:500}
#status.err,#poiStatus.err{color:var(--err)}
#bar{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--line)}
#bar .btn:first-child{flex:1}
details{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
summary{font-weight:600;color:var(--teal)}
.num{width:28px;height:28px;border-radius:50%;background:var(--ink);color:#fff;border:3px solid var(--amber);display:flex;align-items:center;justify-content:center;font:700 13px system-ui,sans-serif}
</style>
</head>
<body>
<div id="app">
  <div id="mapwrap"><div id="map"></div><div id="cross"></div></div>
  <div id="panel">
    <details id="keybox" open>
      <summary>Ключ за OpenRouteService</summary>
      <div class="row" style="margin-top:8px">
        <input type="password" id="key" placeholder="Постави ключа от account.heigit.org" autocomplete="off">
        <button class="btn" id="saveKey">Запази</button>
      </div>
      <p class="hint" style="margin-top:6px">Ключът се пази само в този браузър на телефона.</p>
    </details>

    <section><h2>Транспорт</h2><div class="row" id="transport"></div></section>
    <section><h2>Режим</h2><div class="row" id="modes"></div></section>

    <section>
      <label class="toggle"><input type="checkbox" id="auto"> Оптимизирай реда на спирките</label>
      <p class="hint" id="autoHint" hidden>A е първата, B е последната спирка. Всичко между тях се подрежда по избрания режим.</p>
      <label class="toggle"><input type="checkbox" id="round"> Кръгов маршрут (връщане до A)</label>
    </section>

    <section>
      <h2>Места около маршрута</h2>
      <div class="row"><span id="radLbl">Радиус: 2.0 км</span></div>
      <input type="range" id="rad" min="0.5" max="5" step="0.5" value="2" style="width:100%;accent-color:#0e7c86">
      <div class="row" id="poiChips"></div>
    </section>

    <section>
      <h2>Спирки</h2>
      <div class="row"><input type="text" id="q" placeholder="Търси място по име"><button class="btn" id="addQ">Добави</button></div>
      <div class="row"><button class="btn alt" id="addC">＋ Добави мястото под кръстчето</button></div>
      <p class="hint">Можеш и да натиснеш дълго върху картата.</p>
      <div id="stops"></div>
    </section>

    <div id="status"></div>
    <div id="poiStatus"></div>
  </div>
  <div id="bar">
    <button class="btn" id="build">Построй маршрут</button>
    <button class="btn alt" id="places" disabled>Места</button>
    <button class="btn alt" id="clear">Изчисти</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const BASE = 'https://api.heigit.org/openrouteservice';
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const TRANSPORT = {
  car:  {label: '🚗 Кола',       profile: 'driving-car'},
  bike: {label: '🚴 Велосипед',  profile: 'cycling-regular'},
  foot: {label: '🚶 Пеш',        profile: 'foot-walking'}
};
const MODES = {
  shortest: {label: 'Най-кратък', pref: 'shortest'},
  fastest:  {label: 'Най-бърз',   pref: 'fastest'},
  balanced: {label: 'Балансиран', pref: 'recommended'}
};
const ALL = ['car', 'bike', 'foot'];
const POI = {
  fuel:     {label: '⛽ Бензиностанции',    color: '#e53935', key: 'amenity', values: ['fuel'], tr: ['car']},
  charging: {label: '🔌 Зарядни',           color: '#43a047', key: 'amenity', values: ['charging_station'], tr: ['car']},
  food:     {label: '🍽️ Хранене',           color: '#fb8c00', key: 'amenity', values: ['restaurant', 'fast_food', 'cafe'], tr: ALL},
  sights:   {label: '🏛️ Забележителности',  color: '#1e88e5', key: 'tourism', values: ['attraction', 'viewpoint', 'museum'], tr: ALL},
  water:    {label: '🚰 Чешми',             color: '#00acc1', key: 'amenity', values: ['drinking_water'], tr: ['bike', 'foot']},
  bikeshop: {label: '🔧 Веломагазини',      color: '#6d4c41', key: 'shop', values: ['bicycle'], tr: ['bike']},
  toilet:   {label: '🚻 Тоалетни',          color: '#8e24aa', key: 'amenity', values: ['toilets'], tr: ['foot']}
};

let key = '';
try { key = localStorage.getItem('ors_key') || ''; } catch (e) {}
let stops = [], route = null, pois = [];
let transport = 'car', mode = 'balanced';
const selected = new Set(['fuel', 'food']);

/* ---------- карта ---------- */
const map = L.map('map', {zoomControl: true}).setView([42.7, 25.2], 7);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom: 19, attribution: '© OpenStreetMap'}).addTo(map);
const layer = L.layerGroup().addTo(map);
map.on('contextmenu', e => addStop(e.latlng.lat, e.latlng.lng, 'Спирка'));

/* ---------- мрежа ---------- */
async function http(url, opts) {
  const res = await fetch(url, opts);
  const text = await res.text();
  if (!res.ok) throw new Error('HTTP ' + res.status + ': ' + text.slice(0, 180));
  return JSON.parse(text);
}
function ors(path, body) {
  if (!key) throw new Error('Постави ключ за OpenRouteService (раздел „Ключ“).');
  return http(BASE + path, {
    method: 'POST',
    headers: {'Authorization': key, 'Content-Type': 'application/json'},
    body: JSON.stringify(body)
  });
}
async function geocode(q) {
  const arr = await http('https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' + encodeURIComponent(q));
  if (!arr.length) throw new Error('Не е намерено: ' + q);
  const o = arr[0];
  return {lat: +o.lat, lon: +o.lon, name: o.display_name.split(',').slice(0, 2).join(',').trim()};
}
async function getRoute(list) {
  const r = await ors('/v2/directions/' + TRANSPORT[transport].profile + '/geojson', {
    coordinates: list.map(s => [s.lon, s.lat]),
    preference: MODES[mode].pref,
    radiuses: list.map(() => -1)
  });
  const f = r.features[0];
  return {
    points: f.geometry.coordinates.map(c => [c[1], c[0]]),
    distance: f.properties.summary.distance,
    duration: f.properties.summary.duration
  };
}

/* ---------- оптимизация на реда ---------- */
async function optimize(list) {
  const n = list.length;
  if (n < 4) return {stops: list, savedM: 0, savedS: 0, changed: false};
  if (n > 50) throw new Error('Максимум 50 спирки');
  const r = await ors('/v2/matrix/' + TRANSPORT[transport].profile, {
    locations: list.map(s => [s.lon, s.lat]), metrics: ['distance', 'duration'], units: 'm'
  });
  const fix = m => m.map(row => row.map(v => v == null ? 1e9 : v));
  const d = fix(r.distances), s = fix(r.durations);
  const avg = x => { let t = 0, c = 0; x.forEach(row => row.forEach(v => { if (v > 0 && v < 1e8) { t += v; c++; } })); return c ? t / c : 1; };
  const aD = avg(d), aS = avg(s);
  const cost = (i, j) => mode === 'shortest' ? d[i][j] : mode === 'fastest' ? s[i][j] : d[i][j] / aD + s[i][j] / aS;
  const pathCost = o => { let c = 0; for (let k = 0; k < o.length - 1; k++) c += cost(o[k], o[k + 1]); return c; };

  const original = [...Array(n).keys()];
  let best = original, bestCost = pathCost(original);

  if (n - 2 <= 8) {
    const permute = (cur, rest, acc) => {
      if (acc >= bestCost) return;
      if (!rest.length) {
        const total = acc + cost(cur[cur.length - 1], n - 1);
        if (total < bestCost) { bestCost = total; best = cur.concat([n - 1]); }
        return;
      }
      for (let i = 0; i < rest.length; i++) {
        const x = rest[i];
        const nr = rest.slice(0, i).concat(rest.slice(i + 1));
        permute(cur.concat([x]), nr, acc + cost(cur[cur.length - 1], x));
      }
    };
    permute([0], original.slice(1, n - 1), 0);
  } else {
    let order = [0];
    const rest = original.slice(1, n - 1);
    while (rest.length) {
      let bi = 0;
      rest.forEach((v, i) => { if (cost(order[order.length - 1], v) < cost(order[order.length - 1], rest[bi])) bi = i; });
      order.push(rest.splice(bi, 1)[0]);
    }
    order.push(n - 1);
    let improved = true;
    while (improved) {
      improved = false;
      for (let i = 1; i < n - 2; i++) for (let j = i + 1; j < n - 1; j++) {
        const cand = order.slice(0, i).concat(order.slice(i, j + 1).reverse(), order.slice(j + 1));
        if (pathCost(cand) < pathCost(order) - 1e-9) { order = cand; improved = true; }
      }
    }
    if (pathCost(order) < bestCost) best = order;
  }
  const sum = (x, o) => { let c = 0; for (let k = 0; k < o.length - 1; k++) c += x[o[k]][o[k + 1]]; return c; };
  return {
    stops: best.map(i => list[i]),
    savedM: sum(d, original) - sum(d, best),
    savedS: sum(s, original) - sum(s, best),
    changed: best.some((v, i) => v !== original[i])
  };
}

/* ---------- места около маршрута ---------- */
async function fetchPois(points, types, radiusM) {
  if (!types.length || !points.length) return [];
  const step = Math.max(1, Math.floor(points.length / 80));
  const sampled = points.filter((_, i) => i % step === 0).concat([points[points.length - 1]]);
  const poly = sampled.map(p => p[0].toFixed(5) + ',' + p[1].toFixed(5)).join(',');
  let q = '[out:json][timeout:40];';
  types.forEach((id, i) => {
    const t = POI[id];
    q += `nwr["${t.key}"~"^(${t.values.join('|')})$"](around:${radiusM},${poly})->.s${i};.s${i} out center 120;`;
  });
  const res = await fetch('https://overpass-api.de/api/interpreter', {
    method: 'POST',
    headers: {'Content-Type': 'application/x-www-form-urlencoded'},
    body: 'data=' + encodeURIComponent(q)
  });
  const text = await res.text();
  if (!res.ok) throw new Error('HTTP ' + res.status + ': ' + text.slice(0, 120));
  const out = [];
  JSON.parse(text).elements.forEach(e => {
    const tags = e.tags; if (!tags) return;
    const lat = e.lat !== undefined ? e.lat : e.center && e.center.lat;
    const lon = e.lon !== undefined ? e.lon : e.center && e.center.lon;
    if (lat === undefined || lon === undefined) return;
    const id = types.find(k => POI[k].values.includes(tags[POI[k].key]));
    if (!id) return;
    out.push({lat, lon, id, name: tags.name || POI[id].label});
  });
  return out;
}

/* ---------- форматиране ---------- */
const km = m => (m / 1000).toFixed(1) + ' км';
const dur = s => { const m = Math.round(s / 60); return m >= 60 ? Math.floor(m / 60) + ' ч ' + (m % 60) + ' мин' : m + ' мин'; };

/* ---------- интерфейс ---------- */
function setStatus(t, err) { $('status').textContent = t; $('status').className = err ? 'err' : ''; }
function setPoiStatus(t, err) { $('poiStatus').textContent = t; $('poiStatus').className = err ? 'err' : ''; }
function busy(b) { $('build').disabled = b; $('places').disabled = b || !route; $('addQ').disabled = b; }
function resetRoute() { route = null; pois = []; setPoiStatus(''); $('places').disabled = true; }

function addStop(lat, lon, name) {
  stops.push({lat, lon, name: name === 'Спирка' ? 'Спирка ' + (stops.length + 1) : name});
  resetRoute(); render();
}

function tagFor(i) {
  if ($('auto').checked && i === 0) return 'A';
  if ($('auto').checked && stops.length > 1 && i === stops.length - 1) return 'B';
  return String(i + 1);
}

function render(fit) {
  layer.clearLayers();
  if (route) {
    const pl = L.polyline(route.points, {color: '#0e7c86', weight: 6, opacity: .9}).addTo(layer);
    if (fit) map.fitBounds(pl.getBounds(), {padding: [30, 30]});
  }
  pois.forEach(p => {
    L.circleMarker([p.lat, p.lon], {radius: 7, color: '#fff', weight: 2, fillColor: POI[p.id].color, fillOpacity: 1})
      .bindPopup('<b>' + esc(p.name) + '</b><br>' + POI[p.id].label).addTo(layer);
  });
  stops.forEach((s, i) => {
    L.marker([s.lat, s.lon], {icon: L.divIcon({className: '', html: '<div class="num">' + tagFor(i) + '</div>', iconSize: [28, 28], iconAnchor: [14, 14]})})
      .bindPopup(esc(s.name)).addTo(layer);
  });
  const box = $('stops');
  box.innerHTML = '';
  stops.forEach((s, i) => {
    const d = document.createElement('div');
    d.className = 'stop';
    d.innerHTML = '<span class="tag">' + tagFor(i) + '</span><span class="nm">' + esc(s.name) + '</span><button aria-label="Премахни">✕</button>';
    d.querySelector('button').onclick = () => { stops.splice(i, 1); resetRoute(); render(); };
    box.appendChild(d);
  });
}

function chips() {
  const t = $('transport'); t.innerHTML = '';
  Object.keys(TRANSPORT).forEach(k => {
    const b = document.createElement('button');
    b.className = 'chip' + (transport === k ? ' on' : ''); b.textContent = TRANSPORT[k].label;
    b.onclick = () => { transport = k; [...selected].forEach(id => { if (!POI[id].tr.includes(k)) selected.delete(id); }); resetRoute(); chips(); render(); };
    t.appendChild(b);
  });
  const m = $('modes'); m.innerHTML = '';
  Object.keys(MODES).forEach(k => {
    const b = document.createElement('button');
    b.className = 'chip' + (mode === k ? ' on' : ''); b.textContent = MODES[k].label;
    b.onclick = () => { mode = k; chips(); };
    m.appendChild(b);
  });
  const p = $('poiChips'); p.innerHTML = '';
  Object.keys(POI).filter(k => POI[k].tr.includes(transport)).forEach(k => {
    const b = document.createElement('button');
    b.className = 'chip' + (selected.has(k) ? ' on' : ''); b.textContent = POI[k].label;
    b.onclick = () => { selected.has(k) ? selected.delete(k) : selected.add(k); chips(); };
    p.appendChild(b);
  });
}

async function loadPois() {
  try {
    setPoiStatus('Търсене на места…');
    pois = await fetchPois(route.points, [...selected], Math.round(parseFloat($('rad').value) * 1000));
    setPoiStatus('📍 Намерени места: ' + pois.length);
    render();
  } catch (e) { setPoiStatus('Местата не се заредиха: ' + e.message, true); }
}

async function build() {
  if (stops.length < 2) { setStatus('Добави поне 2 спирки', true); return; }
  busy(true); setPoiStatus('');
  try {
    let list = stops.slice(), note = '';
    if ($('auto').checked) {
      setStatus('Оптимизиране на реда…');
      const o = await optimize(list);
      list = o.stops; stops = list;
      if (o.changed) {
        const dm = (o.savedM >= 0 ? '−' : '+') + km(Math.abs(o.savedM));
        const ds = (o.savedS >= 0 ? '−' : '+') + dur(Math.abs(o.savedS));
        note = '\n🔀 Редът е оптимизиран: ' + dm + ', ' + ds + ' спрямо въведения';
      } else note = '\n🔀 Въведеният ред вече е оптимален';
    }
    setStatus('Изчисляване…');
    route = await getRoute($('round').checked ? list.concat([list[0]]) : list);
    pois = [];
    setStatus('✅ ' + km(route.distance) + ' • ' + dur(route.duration) + note);
    render(true);
    if (selected.size) await loadPois();
  } catch (e) {
    setStatus('Грешка: ' + e.message, true);
  }
  busy(false);
}

/* ---------- събития ---------- */
$('saveKey').onclick = () => {
  key = $('key').value.trim();
  try { localStorage.setItem('ors_key', key); } catch (e) {}
  setStatus(key ? 'Ключът е запазен.' : 'Ключът е изтрит.');
  if (key) $('keybox').open = false;
};
$('addQ').onclick = async () => {
  const q = $('q').value.trim(); if (!q) return;
  busy(true); setStatus('Търсене…');
  try { const s = await geocode(q); stops.push(s); $('q').value = ''; resetRoute(); render(); map.setView([s.lat, s.lon], Math.max(map.getZoom(), 11)); setStatus(''); }
  catch (e) { setStatus('Грешка: ' + e.message, true); }
  busy(false);
};
$('q').addEventListener('keydown', e => { if (e.key === 'Enter') $('addQ').click(); });
$('addC').onclick = () => { const c = map.getCenter(); addStop(c.lat, c.lng, 'Спирка'); };
$('auto').onchange = () => { $('autoHint').hidden = !$('auto').checked; render(); };
$('rad').oninput = () => { $('radLbl').textContent = 'Радиус: ' + parseFloat($('rad').value).toFixed(1) + ' км'; };
$('build').onclick = build;
$('places').onclick = async () => { busy(true); await loadPois(); busy(false); };
$('clear').onclick = () => { stops = []; resetRoute(); setStatus(''); render(); };

$('key').value = key;
if (key) $('keybox').open = false;
chips(); render();
</script>
</body>
</html>
